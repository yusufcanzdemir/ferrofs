[package]
name = "ferro-storage"
description = "Storage analyzer, duplicate finder, compression and cleanup tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ferro-core.workspace = true
ferro-ipc.workspace = true
anyhow = "1.0.104"
eframe = "0.32.3"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_System_Threading", "Win32_System_Time", "Win32_Storage_FileSystem", "Win32_Storage_Compression", "Win32_System_IO", "Win32_System_Ioctl"] }
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }
blake3 = "1.8.7"
rayon = "1.12.0"

[lints]
workspace = true

[build-dependencies]
embed-manifest = "1.5.1"
