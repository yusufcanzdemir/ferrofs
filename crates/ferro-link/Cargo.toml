[package]
name = "ferro-link"
description = "Tray app that creates symlinks, junctions and hard links via hotkeys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Shell_Common", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_SystemServices", "Win32_System_Registry"] }

[lints]
workspace = true

[build-dependencies]
embed-manifest = "1.5.1"
